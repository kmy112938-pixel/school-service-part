<!doctype html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>스쿨서비스 파트</title>
<style>
:root{
  --bg:#F3F5F8;--surface:#fff;--surface-2:#ECF0F4;--line:#D9E0E7;
  --ink:#15203A;--ink-2:#465166;--ink-3:#7A8597;
  --navy:#1F2A44;--teal:#117373;--teal-soft:#DCEFEE;
  --warn:#A86A12;--warn-soft:#FAEFD8;--bad:#B83A2E;--bad-soft:#F8E1DE;
  --ok:#2C7A51;--ok-soft:#DFF1E6;--idle:#66748A;--idle-soft:#E8ECF1;--brown:#93653F;--brown-soft:#F2E7DD;
  --task-progress:#174EA6;--task-progress-bg:#E8F1FF;
  --task-wait:#495057;--task-wait-bg:#F1F3F5;
  --task-hold:#805000;--task-hold-bg:#FFF2D6;
  --task-done:#176344;--task-done-bg:#E4F5EC;
  --f:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal)}
.wrap{max-width:1440px;margin:0 auto;padding:16px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:22px}
.me{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink-2)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.small{padding:4px 10px;font-size:14.5px}
.btn.ghost{border-color:transparent;background:none;color:var(--teal)}
.btn[disabled]{opacity:.5;cursor:default}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 16px}
nav button{border:0;background:none;padding:9px 14px;font-weight:700;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--teal)}
section{margin-bottom:22px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
h2{margin:0;font-size:17px}
h2 small{font-weight:500;color:var(--ink-3);margin-left:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.list{display:flex;flex-direction:column;gap:8px}
.meta{font-size:14px;color:var(--ink-3)}
.title{font-weight:700}
.empty{padding:18px;text-align:center;color:var(--ink-3);background:var(--surface);border:1px dashed var(--line);border-radius:10px}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:13.5px;font-weight:700;white-space:nowrap}
.flag{display:inline-block;border-radius:4px;padding:1px 6px;font-size:13.5px;font-weight:600;margin:2px 4px 0 0}
.flag.bad{background:var(--bad-soft);color:var(--bad)}.flag.warn{background:var(--warn-soft);color:var(--warn)}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
textarea.field{resize:vertical;min-height:70px}
label.lab{display:block;font-size:14.5px;font-weight:600;color:var(--ink-2);margin:12px 0 4px}
.row2{display:grid;grid-template-columns:160px minmax(0,1fr);gap:10px}
.hint{overflow-wrap:anywhere;font-size:14.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:6px 10px;margin-top:6px}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
.task .main{grid-row:1/3}
.task .next{font-size:15px;color:var(--ink-2);margin-top:2px}
.task .dates{text-align:right;font-size:14px;color:var(--ink-3);white-space:nowrap;line-height:1.6}
.task .dates .bad{color:var(--bad);font-weight:700}.task .dates .warn{color:var(--warn);font-weight:700}
 .task .act{align-self:end;justify-self:end}
.section-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.inline-editor{border:1px solid #B6C9D7;background:#fff;border-radius:12px;padding:16px;margin:10px 0 14px;box-shadow:0 4px 16px rgba(25,42,65,.06)}
.editor-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.editor-top h3{margin:0;font-size:17px}
.editor-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.req-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.req-edit{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.req-edit input{margin:6px 0 8px}
.home-task-list{container-type:inline-size}
.home-task{display:grid;grid-template-columns:minmax(0,1.16fr) minmax(0,1fr);gap:8px 12px;align-items:start;overflow-wrap:anywhere}
.home-task:has(>.next):has(>.home-task-links){grid-template-columns:minmax(0,1.16fr) minmax(0,1fr) minmax(0,.6fr)}
.home-task:not(:has(>.next,>.home-task-links))>.home-task-summary{grid-column:1 / -1}
.home-task .next{font-size:15px;color:var(--ink-2)}
.home-task-links .task-links{margin-top:0}
.home-task-meta{grid-column:1 / -1;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.home-task-meta .btn{margin-left:auto}
@container(max-width:440px){
  .home-task,.home-task:has(>.next):has(>.home-task-links){grid-template-columns:minmax(0,1fr) minmax(0,.55fr)}
  .home-task-summary,.home-task>.next,.home-task:not(:has(>.next))>.home-task-links{grid-column:1 / -1}
  .home-task:has(>.home-task-links)>.next{grid-column:1}
}
.compact-news{display:flex;align-items:start;justify-content:space-between;gap:12px}
.compact-news .meta{flex-shrink:0}
.details-history{margin-top:20px}
.details-history summary{cursor:pointer;font-weight:600;color:var(--ink-2);padding:8px 0}
.stack-mobile{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.small-quiet{font-size:14px;color:var(--ink-3)}
.req .body{margin:6px 0;white-space:pre-wrap}
.req .reply{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.req .reply input{flex:1 1 220px}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-size:14px;color:var(--ink-2);border-top:0}
tr.grp td{background:var(--surface-2);font-weight:700;font-size:14.5px}
td.done,td.task-next,.home-task .next,.hint{white-space:pre-wrap}
.team-table-wrap,#taskAddForm{container-type:inline-size}
.team-table-wrap table{table-layout:fixed;word-break:keep-all;overflow-wrap:anywhere}
.team-table-wrap :is(th,td){padding-inline:8px}
.team-head th{white-space:nowrap}
.team-head .task-priority{width:76px}
.team-head .task-title{width:25%}
.team-head .task-due{width:58px}
.team-head .task-status{width:76px}
.team-head .task-owner{width:10%}
.team-head .task-next{width:15%}
.team-head .task-related{width:12%}
.team-head .task-edit{width:68px}
.team-table-wrap .task-links{margin-top:0}
.task-mobile-label{display:none}
.task-name-button{max-width:100%;background:none;border:0;padding:0;color:var(--teal);font-weight:700;text-align:left;text-decoration:underline;text-underline-offset:3px}
.task-name-button:hover{color:var(--ink)}
.task-week{margin-top:4px;font-size:14px;white-space:pre-wrap}
.task-form .editor-top{flex-wrap:wrap}
.task-edit-actions{margin:0 0 0 auto}
.task-edit-actions .btn{min-width:78px;min-height:44px;padding:9px 16px;font-size:17px}
.task-edit-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:14px}
.task-edit-grid fieldset{margin:0;padding:0 12px 12px;min-width:0;border:1px solid var(--line);border-radius:8px}
.task-edit-grid legend{font-weight:700}
.task-edit-grid .row2{grid-template-columns:repeat(2,minmax(0,1fr))}
.task-edit-grid .field{min-width:0}
.task-record-grid textarea{min-height:112px}
.task-record-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px;align-items:start}
@container(max-width:720px){.task-edit-grid,.task-record-grid{grid-template-columns:minmax(0,1fr)}}
@container(max-width:440px){.task-edit-grid .row2{grid-template-columns:minmax(0,1fr)}}
@container(max-width:980px){
  .team-table-wrap :is(table,tbody){display:block}
  .team-table-wrap table{border:0;background:none;overflow:visible}
  .team-head{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  .team-task-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px;margin-bottom:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
  .team-table-wrap .team-task-row td{display:block;min-width:0;padding:4px 0;border:0}
  .team-table-wrap .team-task-row td:empty{display:none}
  .team-task-row .task-title{grid-area:1 / 1}
  .team-task-row .task-title:has(+.task-next:empty){grid-column:1 / -1}
  .team-task-row .task-next{grid-area:1 / 2}
  .team-task-row :is(.task-related,.task-category,.task-edit){grid-column:1 / -1}
  .team-task-row .task-related{grid-row:2}
  .team-task-row .task-edit{justify-self:end}
  .task-mobile-label{display:block;white-space:normal;font-size:13px;font-weight:600;color:var(--ink-2)}
  .team-table-wrap [data-edit-slot]:not([hidden]),.team-table-wrap [data-edit-slot] td{display:block}
  .team-table-wrap [data-edit-slot] td{padding:0;border:0}
}
 .home-history.completed-tasks{margin-top:22px}
.completed-tasks[open]>summary{margin-bottom:10px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tools .field{max-width:100%}
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{background:var(--surface);border-radius:12px;padding:20px;width:min(380px,100%)}
.modal-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.modal-close{border:0;background:none;width:32px;height:32px;margin:-6px -8px -6px 0;border-radius:8px;font-size:22px;line-height:1;color:var(--ink-2)}
.modal-close:hover{background:var(--surface-2)}
.names{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:8px;font-size:15px;z-index:20;max-width:calc(100% - 32px)}
.toast.err{background:var(--bad)}
.loading{padding:40px;text-align:center;color:var(--ink-3)}

/* 홈: 실행할 업무와 요청을 각각 한 열에 두어 스크롤 부담을 줄입니다. */
.home-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.home-grid{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,.96fr);gap:20px;align-items:start}
.home-column{display:flex;flex-direction:column;gap:20px;min-width:0}
.home-section{margin:0;min-width:0}
.home-section .sec-h{margin-bottom:10px}
.home-section .list{gap:10px}
.home-section .card{padding:14px 16px;min-width:0}
.home-section .title,.home-section .req b{overflow-wrap:anywhere}
.home-section .req .body,.home-request-summary .body{overflow-wrap:anywhere}
.home-peer-requests{margin-top:12px}
.home-request-caption{margin:0 0 8px}
.home-task-meta .bad{color:var(--bad);font-weight:700}
.home-task-meta .warn{color:var(--warn);font-weight:700}
.home-history.done-requests{margin-top:12px}
.done-request{padding:10px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.done-request .body{margin:4px 0;white-space:pre-wrap}
.done-request .answer{font-weight:600;white-space:pre-wrap}
.home-history{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.home-history summary{margin:0;cursor:pointer;color:var(--ink-2);font-weight:600;padding:6px 0}
.home-history .table-wrap{margin:6px 0}
.home-history .table-wrap table{border-radius:6px;table-layout:fixed;overflow-wrap:anywhere}
.home-history .table-wrap th:first-child{width:3.5rem}
.home-section #newsForm .inline-editor{margin-top:0}
@media(max-width:780px){
  .home-grid{grid-template-columns:minmax(0,1fr);gap:20px}
  .home-column{gap:20px}
}
@media (max-width:640px){
  .row2{grid-template-columns:1fr}
  .inline-editor{padding:12px}
  th,td{padding:7px 8px}
}

.task-links{font-size:14px;margin-top:4px;overflow-wrap:anywhere}.task-links a{text-decoration:underline}.me{flex-wrap:wrap;justify-content:flex-end}.record-editor{container-type:inline-size;scroll-margin-top:16px}
@media(max-width:640px){header{align-items:flex-start}.me{justify-content:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>스쿨서비스 파트</h1></div>
    <div class="me"><span id="meLabel"></span><button class="btn small" id="meBtn" type="button">이름 바꾸기</button></div>
  </header>
  <nav>
    <button type="button" data-v="home" aria-selected="true">홈</button>
    <button type="button" data-v="team" aria-selected="false">업무리스트</button>
  </nav>
  <main id="main"><div class="loading">불러오는 중…</div></main>
</div>
<div id="overlay" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
var D = null, view = 'home', me = '', newsAll = false, teamOwner = '', teamStatus = '', completedOwner = '', homeComposer = null;
var ST = {'진행중':['--teal','--teal-soft'],'대기':['--idle','--idle-soft'],'보류':['--brown','--brown-soft'],'완료':['--ok','--ok-soft'],
          '확인 전':['--idle','--idle-soft'],'확인 중':['--warn','--warn-soft']};
var TASK_ST = {'진행중':['--task-progress','--task-progress-bg'],'대기':['--task-wait','--task-wait-bg'],
               '보류':['--task-hold','--task-hold-bg'],'완료':['--task-done','--task-done-bg']};

function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function taskLinks(value){
  var raw=String(value||'').trim();if(!raw)return '';
  var lines=raw.split(/\r?\n/).filter(function(l){return l.trim()});var html=[],pending='';
  lines.forEach(function(line){var urls=line.match(/https?:\/\/[^\s<>"']+/gi)||[];
    if(!urls.length){if(pending)html.push(esc(pending));pending=line.trim();return;}
    urls.forEach(function(url,i){var label=(i===0?(pending||line.replace(url,'').trim()):'')||'관련 링크';html.push('<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>');});pending='';
  });if(pending)html.push(esc(pending));return '<div class="task-links">'+html.join(' · ')+'</div>';
}
function pill(s,colors){colors=colors||ST;var c=colors[s]||colors['대기'];return '<span class="pill" style="color:var('+c[0]+');background:var('+c[1]+')">'+esc(s||'-')+'</span>'}
function toast(m,err){var t=$('#toast');t.textContent=m;t.className='toast'+(err?' err':'');t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2600)}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(e){return ''}}

// 날짜 (yyyy-mm-dd 문자열)
function d2n(s){var p=s.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2])}
function n2d(n){return new Date(n).toISOString().slice(0,10)}
function addDays(s,k){return n2d(d2n(s)+k*864e5)}
function monday(s){var w=new Date(d2n(s)).getUTCDay();return addDays(s,-((w+6)%7))}
function md(s){if(!s)return '';var p=s.split('-');return (+p[1])+'/'+(+p[2])}
function isDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return false;var p=s.split('-'),d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));return d.toISOString().slice(0,10)===s}

function ownersOf(t){return String(t.owner||'').split(/[,·\/]/).map(function(x){return x.trim()}).filter(Boolean)}
function taskOf(name){for(var i=0;i<D.tasks.length;i++)if(D.tasks[i].name===name)return D.tasks[i];return null}
function fromOf(r){if(r.from)return r.from;var t=taskOf(r.task);return t?ownersOf(t)[0]||'':''}
function latestNext(name){
  var best=null;
  D.records.forEach(function(r){
    if(r.task===name&&String(r.next||'').trim()&&isDate(r.date)&&(!best||r.date>=best.date))best=r;
  });
  return best?best.next:'';
}
function recsInWeek(name,ws,records){var we=addDays(ws,6);return (records||D.records).filter(function(r){return r.task===name&&isDate(r.date)&&r.date>=ws&&r.date<=we})}

// 시트 저장
var API_URL='https://script.google.com/macros/s/AKfycbzZD516j0LlTC5l7I9rmKpM0g0sL3E947upq_S3yXLEJdE8XwL0shWPwSvWqgPW_6re/exec';
var LEGACY_UNTIL='2026-11-19'; // 이전 시트에서 옮긴 초기 기록(작성자·등록 일시 없음)
var loadedAt=0,busy=false;
function todayLocal(){var p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());var v={};p.forEach(function(x){v[x.type]=x.value});return v.year+'-'+v.month+'-'+v.day}
function api(fn,args){
 return fetch(API_URL,{method:'POST',body:JSON.stringify({fn:fn,args:args||[]}),redirect:'follow'})
  .catch(function(){throw Error('연결하지 못했어요. 인터넷을 확인해 주세요.')})
  .then(function(r){return r.text()})
  .then(function(text){
   var res;try{res=JSON.parse(text)}catch(e){throw Error('저장 서버가 응답하지 않아요.')}
   if(!res.ok)throw Error(res.error||'처리하지 못했어요.');
   return res.data;
  });
}
function setData(data){
 data.records.forEach(function(r){
  r.legacy=!!r.recordId&&!r.author&&!r.created&&r.date<=LEGACY_UNTIL;
  if(r.legacy)r.next='';
 });
 D=data;loadedAt=Date.now();
}
function call(fn,args,btn,okMsg){
 if(busy)return;
 var p=args&&args[0],okText=okMsg,done=null;
 try{
  if(fn==='addTask'||fn==='editTask'){
   var existing=fn==='editTask'?D.tasks.find(function(x){return String(x.no)===String(p.id)}):null; if(fn==='editTask'&&!existing)throw Error('업무를 찾지 못했어요.');
   var name=String(p.name||'').trim(), rank=Number(p.priority);
   if(!name)throw Error('업무명을 입력해 주세요.');
   if(D.tasks.some(function(x){return x.name===name&&x!==existing}))throw Error('이미 등록된 업무명이에요.');
   if(!Number.isSafeInteger(rank)||rank<1)throw Error('우선순위를 확인해 주세요.');
   if(!p.owners.length)throw Error('담당자를 선택해 주세요.');
   var record=p.record,hasRecord=record&&(String(record.done||'').trim()||String(record.next||'').trim());
   if(hasRecord&&!isDate(record.date))throw Error('기록 날짜를 확인해 주세요.');
   var completed=p.status==='완료',newlyCompleted=completed&&(!existing||existing.status!=='완료');
   var conflict=newlyCompleted?null:D.tasks.find(function(task){return task!==existing&&(task.status==='완료')===completed&&taskPriority(task)===rank});
   if(conflict&&!confirm('우선순위 '+rank+'번에 ‘'+conflict.name+'’ 업무가 있습니다.\n기존 업무의 우선순위를 자동 조정하고 저장할까요?'))return;
   p.me=me;
   okText=newlyCompleted&&existing?'완료 처리하고 우선순위를 다시 정렬했어요':conflict?'우선순위를 조정하고 저장했어요':hasRecord?'업무와 진행 기록을 저장했어요':existing?'업무를 저장했어요':'업무를 추가했어요';
   done=function(){
    if(completed){if(completedOwner&&!p.owners.includes(completedOwner))completedOwner=''}
    else{
     if(teamOwner&&!p.owners.includes(teamOwner))teamOwner='';
     if(teamStatus&&teamStatus!==p.status)teamStatus='';
    }
   };
  }
 }catch(e){toast(e.message,true);return}
 busy=true;
 var label=btn?btn.textContent:'';
 if(btn){btn.disabled=true;btn.textContent='저장 중…'}
 api(fn,args).then(function(data){
  setData(data);if(done)done();render();if(okText)toast(okText);
 }).catch(function(e){
  toast(e.message||'처리하지 못했어요.',true);
 }).then(function(){busy=false;if(btn){btn.disabled=false;btn.textContent=label}});
}
function load(){
 api('getData').then(function(data){
  setData(data);
  if(!me||D.names.indexOf(me)<0)pickName();
  render();
 }).catch(function(e){
  if(D)return;
  $('#main').innerHTML='<div class="empty">'+esc(e.message)+'<br><button class="btn" type="button" id="retry" style="margin-top:10px">다시 불러오기</button></div>';
  $('#retry').onclick=function(){$('#main').innerHTML='<div class="loading">불러오는 중…</div>';load()};
 });
}

 api('getData').then(function(data){

// 이름 고르기
function pickName(){
  var o=$('#overlay');o.hidden=false;o.className='overlay';
  var canClose=!!me&&D.names.indexOf(me)>=0; // 이름을 아직 안 고른 첫 화면에서는 닫지 않음
  o.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-label="이름 고르기"><div class="modal-top"><h2>내 이름을 골라 주세요</h2>'+
    (canClose?'<button class="modal-close" type="button" data-close aria-label="닫기">×</button>':'')+'</div><div class="names">'+
    D.names.map(function(n){return '<button class="btn" type="button" data-n="'+esc(n)+'">'+esc(n)+'</button>'}).join('')+'</div></div>';

    if(e.target.closest('[data-close]'))return closePopup();
    var b=e.target.closest('[data-n]');if(!b)return;me=b.dataset.n;store('sb-part-me',me);o.hidden=true;o.innerHTML='';render()};

function closePopup(){
  var o=$('#overlay');
  if(o.hidden||!o.querySelector('[data-close]'))return;
  o.hidden=true;o.innerHTML='';$('#meBtn').focus();
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!e.isComposing)closePopup()});

function setView(v){
  view=['home','team','plans'].includes(v)?v:'home';
  document.querySelectorAll('nav button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.v===view)});
}
function go(v){
  setView(v);
  if(location.hash!=='#'+view)history.replaceState(history.state,'','#'+view);
  render();
  window.scrollTo(0,0);
}
function render(){
  $('#meLabel').textContent=me?me+' 님':'';

  if(view==='home')renderHome();
  else if(view==='plans')renderPlans();
  else renderTeam();
}

/* ---------- 공용 기록/요청 작성 ---------- */
function taskOptions(selected){
  var open=D.tasks.filter(function(x){return x.status!=='완료'});
  var mine=open.filter(function(x){return ownersOf(x).indexOf(me)>=0});
  var others=open.filter(function(x){return ownersOf(x).indexOf(me)<0});
  var opt=function(x){return '<option value="'+esc(x.name)+'"'+(x.name===selected?' selected':'')+'>'+esc(x.name)+(x.status&&x.status!=='진행중'?' ('+esc(x.status)+')':'')+'</option>'};
  return '<option value="">업무를 골라 주세요</option>'+(mine.length?'<optgroup label="내 업무">'+mine.map(opt).join('')+'</optgroup>':'')+
    (others.length?'<optgroup label="그 밖의 업무">'+others.map(opt).join('')+'</optgroup>':'');

    '<div class="editor-top"><h3>'+(requestOnly?'확인 요청 보내기':'진행 내용 기록')+'</h3>'+

    '<div><label class="lab">업무</label><select class="field" data-f="task">'+taskOptions(task)+'</select></div></div>'+

    '<div><label class="lab" for="home-record-next">다음 할 일</label><textarea class="field" data-f="next" id="home-record-next" placeholder="다음에 할 일 (선택)"></textarea>'+

    '<button class="btn primary" type="button" data-editor-save>'+(requestOnly?'요청 보내기':'기록 저장')+'</button></div></div>';

function wireEditor(el,close){
  var f=function(name){return el.querySelector('[data-f="'+name+'"]')};
  var hint=function(){var n=f('task').value,p=n?latestNext(n):'';f('hint').innerHTML=p?'<div class="hint">직전 계획 · '+esc(p)+'</div>':''};
  f('task').onchange=function(){hint()};hint();
  var toggle=f('req-toggle');
  if(toggle)toggle.onclick=function(){f('req-fields').hidden=!f('req-fields').hidden;toggle.textContent=f('req-fields').hidden?'+ 확인 요청도 보내기':'− 요청 빼기'};
  el.querySelectorAll('[data-editor-close],[data-editor-cancel]').forEach(function(b){b.onclick=function(){if(close)close()}});
  el.querySelector('[data-editor-save]').onclick=function(){
    var btn=this, date=f('date').value,task=f('task').value,done=f('done')?f('done').value.trim():'',next=f('next')?f('next').value.trim():'';
    var withReq=!f('req-fields').hidden,to=withReq?f('to').value:'',req=withReq?f('req').value.trim():'';
    if(!isDate(date)){toast('날짜를 확인해 주세요.',true);f('date').focus();return}
    if(!task){toast('업무를 골라 주세요.',true);f('task').focus();return}
    if(withReq&&!req){toast('요청 내용을 적어 주세요.',true);f('req').focus();return}
    if(withReq&&!to){toast('받는 사람을 골라 주세요.',true);f('to').focus();return}
    if(!done&&!next&&!req){toast('진행 현황이나 다음 할 일을 적어 주세요.',true);(f('done')||f('req')).focus();return}
    call('addRecord',[{date:date,task:task,done:done,next:next,from:me,to:to,req:req}],btn,withReq&& !done&&!next?'요청을 보냈어요':'저장했어요');
  };
}
function openHomeEditor(mode,task,slot){
  homeComposer={mode:mode,task:task||''};
  document.querySelectorAll('.task-editor-slot').forEach(function(x){x.innerHTML=''});
  $('#homeComposer').innerHTML='';
  var place=slot||$('#homeComposer');
  if(!place)return;
  place.innerHTML=editorHTML(mode,task||'',true);
  wireEditor(place.querySelector('.record-editor'),function(){homeComposer=null;place.innerHTML=''});
  place.scrollIntoView({behavior:'smooth',block:'nearest'});
  var focus=place.querySelector(mode==='request'?'[data-f="task"]':'[data-f="done"]');if(focus)focus.focus();
}

      var title=$('#nTitle').value.trim(),link=$('#nLink').value.trim();
      if(!title){toast('제목을 적어 주세요.',true);$('#nTitle').focus();return}
      if(link&&!/^https?:\/\//i.test(link)){toast('문서 링크를 확인해 주세요.',true);$('#nLink').focus();return}
      call('addNews',[{title:title,summary:$('#nSum').value,link:link,by:me}],this,'소식을 올렸어요');
    };
  };
  if($('#newsMore'))$('#newsMore').onclick=function(){newsAll=!newsAll;renderHome()};
}

/* ---------- 업무리스트 ---------- */
function taskPriority(task){
  var n=Number(task.priority||task.no);
  return n>0?n:Infinity;
}
function taskWeekNotes(name,ws,source){
  var records=recsInWeek(name,ws,source).filter(function(r){return String(r.done||'').trim()})
    .sort(function(a,b){return a.date.localeCompare(b.date)});
  var done=records.map(function(r){return md(r.date)+' '+r.done}).join('\n');
  return done?'<div class="task-week"><span class="meta">진행 현황 · </span>'+esc(done)+'</div>':'';
}
function taskDetailCell(label,content,cssClass){
  return '<td role="cell"'+(cssClass?' class="'+cssClass+'"':'')+'>'+
    (content?'<span class="task-mobile-label" aria-hidden="true">'+label+'</span>'+content:'')+'</td>';
}
function teamTaskTable(rows,ws,emptyText){
  return rows.length?'<div class="team-table-wrap"><table role="table"><thead class="team-head" role="rowgroup"><tr role="row">'+
    '<th class="task-priority" scope="col" role="columnheader">우선순위</th><th class="task-title" scope="col" role="columnheader">업무명</th>'+
    '<th class="task-next" scope="col" role="columnheader">다음 할 일</th><th class="task-related" scope="col" role="columnheader">관련 링크</th>'+
    '<th class="task-due" scope="col" role="columnheader">마감</th><th class="task-status" scope="col" role="columnheader">상태</th>'+
    '<th class="task-owner" scope="col" role="columnheader">담당자</th><th scope="col" role="columnheader">분류</th>'+
    '<th class="task-edit" scope="col" role="columnheader" aria-label="수정"></th></tr></thead><tbody role="rowgroup">'+rows.map(function(x){
        var rank=taskPriority(x),taskId=esc(x.no);
        return '<tr class="team-task-row" role="row">'+taskDetailCell('우선순위',esc(Number.isFinite(rank)?rank:'-'))+
          '<td class="task-title" role="cell"><button class="task-name-button" type="button" data-edit-task="'+taskId+'" aria-expanded="false" aria-label="'+esc(x.name)+' 수정">'+esc(x.name)+'</button>'+
          taskWeekNotes(x.name,ws)+'</td>'+
          taskDetailCell('다음 할 일',esc(latestNext(x.name)),'task-next')+taskDetailCell('관련 링크',taskLinks(x.link),'task-related')+
          taskDetailCell('마감',esc(md(x.due)))+taskDetailCell('상태',pill(x.status,TASK_ST))+taskDetailCell('담당자',esc(x.owner))+
          taskDetailCell('분류',esc(x.cat),'task-category')+
          '<td class="task-edit" role="cell"><button class="btn small" type="button" data-edit-task="'+taskId+'" aria-expanded="false">수정</button></td></tr>'+
          '<tr hidden data-edit-slot="'+taskId+'" role="row"><td colspan="9" role="cell"></td></tr>';
      }).join('')+'</tbody></table></div>'
    :'<div class="empty">'+esc(emptyText)+'</div>';
}

function renderTeam(){
  var details=$('#completedTasks'), completedOpen=details&&details.open;
  var ws=monday(D.today);
  var rows=D.tasks.slice().sort(function(a,b){return taskPriority(a)-taskPriority(b)});
  var active=rows.filter(function(x){
    return x.status!=='완료'&&(!teamOwner||ownersOf(x).includes(teamOwner))&&(!teamStatus||x.status===teamStatus);
  });
  var completed=rows.filter(function(x){return x.status==='완료'});
  var visibleCompleted=completed.filter(function(x){return !completedOwner||ownersOf(x).includes(completedOwner)});
  function ownerFilter(id,owner){
    return '<select class="field" id="'+id+'" style="width:auto"><option value="">담당자 전체</option>'+D.names.map(function(n){return '<option'+(n===owner?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select>';
  }
  var statuses=Array.from(new Set(['진행중','대기','보류'].concat(rows.map(function(x){return x.status}).filter(function(s){return s&&s!=='완료'}))));
  var h='<div class="tools">'+ownerFilter('tOwner',teamOwner)+
    '<select class="field" id="tStatus" style="width:auto"><option value="">상태 전체</option>'+statuses.map(function(n){return '<option'+(n===teamStatus?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select><button class="btn primary" type="button" id="taskAdd">+ 업무 추가</button></div><div id="taskAddForm"></div>';
  h+=teamTaskTable(active,ws,'해당 업무가 없어요.');
  h+='<details class="home-history completed-tasks" id="completedTasks"'+(completedOpen?' open':'')+'><summary>완료 업무 ('+completed.length+')</summary>'+
    (completed.length?'<div class="tools">'+ownerFilter('completedOwner',completedOwner)+'</div>':'')+
    teamTaskTable(visibleCompleted,ws,completedOwner&&completed.length?'해당 업무가 없어요.':'완료된 업무가 없어요.')+'</details>';
  $('#main').innerHTML=h;
  $('#tOwner').onchange=function(){teamOwner=this.value;renderTeam()};
  $('#tStatus').onchange=function(){teamStatus=this.value;renderTeam()};
  if(completed.length)$('#completedOwner').onchange=function(){completedOwner=this.value;renderTeam()};
  function showTaskForm(f,x,close){
    var nextRank=D.tasks.filter(function(task){return task.status!=='완료'}).length+1;
    var v=x||{name:'',priority:nextRank,owner:'',status:'진행중',due:'',cat:'',issue:'',link:''};
    var previousNext=x?latestNext(x.name):'';
    var recordFields='<fieldset class="task-record-fields"><legend>진행 기록'+(x?'':' (선택)')+'</legend>'+
      '<label class="lab" for="task-record-date">기록 날짜</label><input class="field" id="task-record-date" name="recordDate" type="date" value="'+esc(todayLocal())+'">'+
      '<div class="task-record-grid"><div><label class="lab" for="task-record-done">진행 현황</label>'+
      '<textarea class="field" id="task-record-done" name="recordDone"></textarea></div>'+
      '<div><label class="lab" for="task-record-next">다음 할 일</label><textarea class="field" id="task-record-next" name="recordNext"></textarea>'+
      (previousNext?'<div class="hint">직전 계획 · '+esc(previousNext)+'</div>':'')+'</div></div></fieldset>';
    var taskFields='<div class="row2"><div><label class="lab">우선순위</label><input class="field" name="priority" type="number" min="1" step="1" required value="'+esc(v.priority||v.no)+'"></div><div><label class="lab">상태</label><select class="field" name="status">'+['진행중','대기','보류','완료'].map(function(n){return '<option'+(n===v.status?' selected':'')+'>'+n+'</option>'}).join('')+'</select></div></div>'+
      '<label class="lab">담당자</label><div class="stack-mobile">'+D.names.map(function(n){return '<label><input type="checkbox" name="owner" value="'+esc(n)+'"'+(ownersOf(v).includes(n)?' checked':'')+'> '+esc(n)+'</label>'}).join('')+'</div>'+
      '<div class="row2"><div><label class="lab">마감일</label><input class="field" type="date" name="due" value="'+esc(v.due)+'"></div><div><label class="lab">분류</label><select class="field" name="cat"><option value="">선택 안 함</option>'+D.cats.map(function(c){return '<option'+(c===v.cat?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select></div></div>'+
      '<label class="lab">이슈·비고</label><textarea class="field" name="issue">'+esc(v.issue)+'</textarea><label class="lab">관련 링크</label><textarea class="field" name="link">'+esc(v.link)+'</textarea>';
    var actions='<div class="editor-actions task-edit-actions"><button class="btn" type="button" data-cancel>취소</button><button class="btn primary" type="submit">저장</button></div>';
    f.innerHTML='<form class="inline-editor task-form"><div class="editor-top"><h3>'+(x?'업무 수정':'업무 추가')+'</h3>'+actions+'</div>'+
      '<label class="lab">업무명</label><input class="field" name="name" required value="'+esc(v.name)+'">'+
      '<div class="task-edit-grid">'+recordFields+'<fieldset><legend>업무 정보</legend>'+taskFields+'</fieldset></div></form>';
    var form=f.querySelector('form');form.querySelector('[data-cancel]').onclick=close;
    form.onsubmit=function(e){
      e.preventDefault();
      var get=function(n){return form.elements.namedItem(n).value};
      var task={id:x?x.no:'',name:get('name'),priority:get('priority'),
        owners:Array.from(form.querySelectorAll('[name=owner]:checked')).map(function(el){return el.value}),
        status:get('status'),due:get('due'),cat:get('cat'),issue:get('issue'),link:get('link')};
      if(x)task.base={name:x.name,cat:x.cat,owner:x.owner,status:x.status,due:x.due,issue:x.issue,link:x.link};
      task.record={date:get('recordDate'),done:get('recordDone'),next:get('recordNext')};
      call(x?'editTask':'addTask',[task],form.querySelector('[type=submit]'));
    };
    form.elements.namedItem(x?'recordDone':'name').focus();
  }
  var editButtons=document.querySelectorAll('[data-edit-task]');
  function closeForms(){
    $('#taskAddForm').innerHTML='';
    document.querySelectorAll('[data-edit-slot]').forEach(function(r){r.hidden=true;r.firstElementChild.innerHTML=''});
    editButtons.forEach(function(button){button.setAttribute('aria-expanded','false')});
  }
  $('#taskAdd').onclick=function(){var f=$('#taskAddForm'),was=!!f.innerHTML;closeForms();if(!was)showTaskForm(f,null,closeForms)};
  editButtons.forEach(function(button){
    button.onclick=function(){
      var row=button.closest('tr'),slot=row.nextElementSibling,wasOpen=!slot.hidden;
      var task=D.tasks.find(function(t){return String(t.no)===button.dataset.editTask});
      closeForms();
      if(wasOpen||!task)return;
      slot.hidden=false;
      row.querySelectorAll('[data-edit-task]').forEach(function(control){control.setAttribute('aria-expanded','true')});
      showTaskForm(slot.firstElementChild,task,closeForms);
    };
  });
}

document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){go(b.dataset.v)}});
$('#meBtn').onclick=function(){if(D)pickName()};
me=store('sb-part-me');
setView(location.hash.slice(1));
load();
</script>
